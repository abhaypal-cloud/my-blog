<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  
  <header class="header">
    <div class="container header-wrap">
      <a href="#home" class="logo">journal.</a>
      <nav class="nav">
        <a href="#new" class="new-btn"><i data-feather="plus"></i> New Note</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">
          <i data-feather="moon" class="dark-icon"></i>
          <i data-feather="sun" class="light-icon"></i>
        </button>
      </nav>
    </div>
  </header>

  <div id="toast" class="toast hidden"></div>

  <main class="main">
    <div class="container">
      
      <!-- List View -->
      <section id="view-home" class="view hidden">
        <div class="hero">
          <h1>Class notes, study guides, and thoughts.</h1>
        </div>
        
        <div class="filter-bar">
          <div class="tags" id="tags-filter"></div>
        </div>

        <div id="posts-list" class="posts-feed">
          <div class="loading">Loading notes...</div>
        </div>
      </section>

      <!-- Read View -->
      <section id="view-read" class="view hidden">
        <a href="#home" class="back-btn"><i data-feather="arrow-left"></i> Back to notes</a>
        
        <article class="post">
          <header class="post-header">
            <h1 id="read-title"></h1>
            <div class="post-meta">
              <span id="read-date"></span>
              <span class="dot">•</span>
              <span id="read-time"></span>
            </div>
            <div id="read-tags" class="post-tags"></div>
          </header>
          
          <div id="read-body" class="post-body"></div>

          <div class="post-actions">
            <button id="btn-edit" class="action-btn"><i data-feather="edit-2"></i> Edit</button>
            <button id="btn-delete" class="action-btn delete"><i data-feather="trash-2"></i> Delete</button>
          </div>
        </article>
      </section>

      <!-- Editor View -->
      <section id="view-editor" class="view hidden">
        <h2 id="editor-title">New Note</h2>

        <form id="editor-form">
          <input type="hidden" id="edit-id">
          
          <div class="input-group">
            <label for="post-title">Title</label>
            <input type="text" id="post-title" required placeholder="Note title...">
          </div>

          <div class="input-group">
            <label for="post-tags">Tags</label>
            <input type="text" id="post-tags" placeholder="e.g. CS101, Study, Exam (comma separated)">
          </div>

          <div class="input-group">
            <div class="tabs">
              <button type="button" class="tab-btn active" id="tab-write">Write</button>
              <button type="button" class="tab-btn" id="tab-preview">Preview</button>
            </div>
            
            <div class="editor-area">
              <textarea id="post-content" required placeholder="Start writing here... (Markdown supported)"></textarea>
              <div id="editor-preview" class="post-body hidden"></div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-btn" id="btn-save">Save Note</button>
            <a href="#home" class="cancel-btn">Cancel</a>
          </div>
        </form>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 my journal. Minimal and simple.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
